# Every accusation this repo is under, and what trying it proved.
# Written only by ~/.claude/hooks/idiot.py. Verdicts are derived, never typed.
- id: a-project-cannot-carry-the-trigger-profile
  type: new
  what: a project's manifest has no section for what counts as a wake, so applying a project does not
    select its trigger profile as it does its pins
  spec: docs/specs/project-power-profile.md
  files:
  - nrf_workbench/project/manifest.py
  - nrf_workbench/project/plan.py
  - nrf_workbench/project/check.py
  - nrf_workbench/project/commands.py
  - nrf_workbench/project/power.py
  - nrf_workbench/instruments/meter.py
  - nrf_workbench/instruments/sampler.py
  test:
    command:
    - bash
    - -c
    - python3 tests/project/test_manifest.py && python3 tests/project/test_power.py && python3 tests/instruments/test_session_profile.py
    criterion: a manifest with a power section validates, plans, applies, checks and releases like the
      pins section; its profile is in force only for an applied project whose board is attached; and a
      session started with no wake_* arguments uses it, writes its events into a recording and says in
      the sidecar where it came from
    runs: 1
  trial:
    file: .proofs/a-project-cannot-carry-the-trigger-profile.trial.txt
    exit: 1
    runs: 1
    failures: 1
    at: '2026-11-21T15:14:00.819'
    commit: 1cabaf5-dirty
  fix:
    file: .proofs/a-project-cannot-carry-the-trigger-profile.fix.txt
    exit: 0
    runs: 1
    failures: 0
    at: '2026-11-21T15:20:32.914'
    commit: 974b64b-dirty
