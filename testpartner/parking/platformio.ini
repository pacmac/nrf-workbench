; parking: the minimal RAK4631 application (docs/specs/testpartner.md).
;
; A device in its bootloader is brought out by flashing ANY valid image. This one does the least
; that is still useful: it keeps USB CDC enumerated (so the board can be seen and touched again),
; blinks both LEDs, and announces its own USB product string so software can tell it from other
; firmware. It never sleeps the system and never starts the radio.
;
; THE BOARD AND VARIANT ARE NOT IN THIS REPOSITORY, on purpose. The PlatformIO-bundled Adafruit
; core has no RAK4631 board or variant. The mt-alarm project vendors both, has no git remote (it is
; local only), and the variant files are LGPL material from other authors, so copying them here
; would publish a private repository's content. Point NRFWB_RAK_DIR at a directory that holds
;
;     boards/wiscore_rak4631.json
;     variants/WisCore_RAK4631_Board/
;
; for example the mt-alarm project's device/rak directory on the development host:
;
;     NRFWB_RAK_DIR=/path/to/mt-alarm/device/rak pio run -e parking
;
; An unset variable is an error, not a silent default. The files are read, never edited.
;
; The result is .pio/build/parking/firmware.zip, a DFU package (SoftDevice 182). It is a build
; artefact and is not committed.

[platformio]
default_envs = parking
boards_dir = ${sysenv.NRFWB_RAK_DIR}/boards

[env:parking]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
board_build.variants_dir = ${sysenv.NRFWB_RAK_DIR}/variants

; The USB product string must be a COMPILE-TIME value: the core starts USB in a task before
; setup() runs, so a string set in setup() could miss the first enumeration. The vendor and product
; ids are unchanged (239a:8029), so the identity code still reads the state as the application.
board_build.usb_product = nrfwb-parking 1

build_flags =
    ; The core's InternalFileSytem flash_cache.c needs it (a C translation unit with no variant.h).
    ; The same define the mt-alarm project uses for this board; it is the blue LED's pin.
    -DLED_BUILTIN=36
