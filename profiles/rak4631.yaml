# Board profile: the RAK4631 (nRF52840 on the WisBlock core). Board facts are DATA, never code
# (docs/specs/devices.md). Every id here was observed; an id in the wrong set could make an app
# look like a bootloader, so unproven ones are left out.
name: rak4631
family: nrf52
chip: nrf52840

# One id SET per mode. The same board shows different ids and product strings in each mode.
# Sources: the app id and the bootloader id 239a:0029 are from lsusb (Peter, 2026-11-16) and the
# probes; 239a:002a is from the brief and is kept in the set; 239a:802a is deliberately NOT listed
# (its role is unknown).
modes:
  app:
    ids: ["239a:8029"]
    product: "WisCore RAK4631 Board"
  bootloader:
    ids: ["239a:0029", "239a:002a"]
    product: "WisBlock RAK4631"

bootloader:
  type: adafruit-serial-dfu
  entry: 1200-baud-touch        # the line-coding touch on the board's own USB CDC
  entry_performed_by: driver    # not the uploader: `enter_bootloader()` does it (one actor)
  baud: 115200
  package: dfu-zip

memory:
  softdevice: {name: S140, version: "6.1.1", fwid: 182}   # fwid 182 = S140 6.1.1 (brief)

# null means UNKNOWN. It is set true or false only from a measurement taken across a mode change.
serial_stable_across_modes: null
